name: Nightly LLM Benchmark Evaluations

on:
  schedule:
    # Run every night at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      dataset_path:
        description: 'Path to custom evaluation dataset (.jsonl)'
        required: false
        default: 'backend/evals/datasets/golden_dataset.jsonl'
      faithfulness_threshold:
        description: 'Minimum required Faithfulness score'
        required: false
        default: '0.80'
      relevance_threshold:
        description: 'Minimum required Answer Relevance score'
        required: false
        default: '0.75'

jobs:
  evaluate:
    name: Run Benchmark Evals
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov ruff

      - name: Run Evals Unit Tests & Contract Validation
        env:
          PYTHONPATH: .
          GOOGLE_SERVICE_ACCOUNT_JSON: /tmp/fake_service_account.json
          GOOGLE_DRIVE_FOLDER_ID: test_drive_folder
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'test_gemini_key' }}
          DATABASE_URL: postgresql://test:test@localhost:5432/testdb
          REDIS_URL: redis://localhost:6379/0
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY || 'test_cohere_key' }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY || 'test_lf_secret' }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY || 'test_lf_public' }}
        run: |
          pytest backend/tests/test_evals.py -v --tb=short

      - name: Synthetic Dataset Dry-Run Verification
        env:
          PYTHONPATH: .
        run: |
          python backend/evals/generate_dataset.py --dry-run --output /tmp/mock_dataset.jsonl
          test -s /tmp/mock_dataset.jsonl
